<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lucas Barros — social card source</title>
  <style>
    @font-face { font-family: Newsreader; src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-standard-normal.woff2'); }
    @font-face { font-family: Newsreader; font-style: italic; src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-standard-italic.woff2'); }
    @font-face { font-family: Inter; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-standard-normal.woff2'); }
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; padding: 48px 64px; background: #f3f0e8; color: #141414; }
    header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid #cfccc3; }
    .name { font: 400 32px Newsreader, Georgia, serif; letter-spacing: -1px; }
    .label { font: 400 12px Inter, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #65665f; }
    main { position: relative; margin-top: 64px; }
    h1 { font: 400 96px/1.05 Newsreader, Georgia, serif; letter-spacing: -4px; margin: 0; }
    em { color: #99523b; font-weight: 400; }
    .intro { font: 400 17px/1.7 Inter, sans-serif; color: #65665f; margin-top: 28px; }
    .mark { position: absolute; right: 16px; top: 18px; font: 400 italic 160px Newsreader, Georgia, serif; color: #a75f45; letter-spacing: -14px; }
    footer { display: flex; justify-content: space-between; margin-top: 56px; padding-top: 22px; border-top: 1px solid #cfccc3; font: 400 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: 1.2px; color: #65665f; }
  </style>
</head>
<body>
  <header><span class="name">Lucas Barros.</span><span class="label">Data science & applied research</span></header>
  <main><h1>Finding structure<br>in the <em>uncertain.</em></h1><p class="intro">Data science as an art of statistical thinking.</p><span class="mark" aria-hidden="true">Lb</span></main>
  <footer><span>Statistical modeling</span><span>Machine learning</span><span>Forecasting</span><span>Applied research</span></footer>

</html>
